workflows:
  android-apk-release:
    name: Android APK Release
    max_build_duration: 60

    environment:
      flutter: 3.22.3
      java: 17
      vars:
        PROJECT_DIR: "BMA"

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Print environment
        script: |
          flutter --version
          dart --version
          java -version
          echo "Working directory:"
          pwd
          echo "Project dir: $PROJECT_DIR"
          ls -la

      - name: Install dependencies
        script: |
          cd $PROJECT_DIR
          flutter pub get

      - name: Run code generation (build_runner)
        script: |
          cd $PROJECT_DIR
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build APK (Release)
        script: |
          cd $PROJECT_DIR
          flutter clean
          flutter pub get
          flutter build apk --release

          echo "=== flutter-apk output ==="
          ls -la build/app/outputs/flutter-apk || true

          echo "=== all apks under build ==="
          find build -type f -name "*.apk" || true

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/**/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - mrkhushalchaudhari@gmail.com
