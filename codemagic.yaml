workflows:
  android-apk-release:
    name: Android APK Release
    max_build_duration: 60
    environment:
      flutter: 3.22.3
      java: 17
      vars:
        PROJECT_DIR: "BMA"
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Print environment
        script: |
          flutter --version
          dart --version
          java -version
          pwd && ls -la

      - name: Install dependencies
        script: |
          cd $PROJECT_DIR
          flutter pub get

      - name: Run code generation
        script: |
          cd $PROJECT_DIR
          dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        script: |
          cd $PROJECT_DIR
          flutter clean
          flutter pub get
          flutter build apk --release
          echo "=== Searching for APK ==="
          find . -name "*.apk" 2>/dev/null
          echo "=== Build outputs ==="
          ls -la build/app/outputs/flutter-apk/ || true
          cp build/app/outputs/flutter-apk/app-release.apk /Users/builder/clone/app-release.apk || true

    artifacts:
      - BMA/build/app/outputs/flutter-apk/app-release.apk
      - BMA/build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/flutter-apk/*.apk
      - "**/app-release.apk"

    publishing:
      email:
        recipients:
          - mrkhushalchaudhari@gmail.com
        notify:
          success: true
          failure: true
