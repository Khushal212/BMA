include ':app'

def localPropertiesFile = new File(rootDir, "local.properties")
def properties = new Properties()

if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> properties.load(stream) }
}

def flutterSdkPath = properties.getProperty("flutter.sdk") ?: System.getenv("FLUTTER_ROOT")
if (flutterSdkPath == null) {
    throw new GradleException("flutter.sdk not set in local.properties and FLUTTER_ROOT not set")
}

apply from: "$flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle"
