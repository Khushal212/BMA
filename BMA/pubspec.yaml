name: bma
description: "VyapaarX - Smart Business Management"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.0.0

  # Database
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.8.0

  # UI & Utils
  intl: ^0.19.0
  uuid: ^4.0.0
  shared_preferences: ^2.2.0

  # PDF & Sharing
  pdf: ^3.10.0
  printing: ^5.11.0
  share_plus: ^7.2.0
  url_launcher: ^6.2.0

  # QR Code for UPI
  qr_flutter: ^4.1.0

  # Image picker for custom QR upload
  image_picker: ^1.0.4

  # Contacts import
  permission_handler: ^11.0.1
  contacts_service: ^0.6.3

  # Material / Fonts
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.14.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/
